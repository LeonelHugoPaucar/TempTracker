<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempTracker</title>
    <link rel="stylesheet" href="./estilos.css" />
</head>
<body>
<div class="contenedor">
    <div class="buscador">
        <input type="text" placeholder="Ingresa nombre de la ciudad" spellcheck="false" autocomplete="false" id="input-ciudad" />
        <button onclick="obtenerClima()"><img src="imagenes/buscar.png" alt="🔍"/></button>
    </div>

    <div class="clima-info">
        <p class="clima-texto">Parcialmente nublado</p>
        <img src="imagenes/clima-ejemplo.png" class="clima-icono" alt="⛅"/>
        <h1 class="temp">22°C</h1>
        <h2 class="ciudad">Huancayo</h2>
    </div> <!-- ¡AQUÍ SE CIERRA CLIMA-INFO! -->

    <div class="detalles">
        <div class="col">
            <img src="imagenes/humedad.png" alt="💧"/>
            <div>
                <p class="humedad">50%</p>
                <p>Humedad</p>
            </div>
        </div>
        <div class="col">
            <img src="imagenes/viento.png" alt="💨"/>
            <div>
                <p class="viento">15 km/h</p>
                <p>Viento</p>
            </div>
        </div>
    </div> <!-- ¡AQUÍ SE CIERRA DETALLES! -->
</div>
<script src="./codigo.js"></script>    
</body>
</html>
